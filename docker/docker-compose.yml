# ---------------------------------------------------------------------------
# RCC LIBRO — the whole system in one command, for running it on another
# machine without a Supabase project or an internet connection.
#
#   cd docker && cp env.example .env
#   docker compose up -d --build          # app + API, empty database
#   docker compose --profile demo run --rm demo-accounts   # the 7 logins
#   docker compose --profile demo run --rm seed            # catalogue + loans
#   → http://localhost:3000
#
# The demo profile is ordered on purpose: 00009 can only classify accounts that
# GoTrue already owns, so logins come first and the sample data second.
#
# Realtime, Storage and Studio from the official Supabase stack are left out —
# this project never opens a realtime channel and stores no uploaded files.
# ---------------------------------------------------------------------------

name: rcc-libro

x-api-keys: &api-keys
  NEXT_PUBLIC_SUPABASE_URL: http://localhost:${KONG_HTTP_PORT:-8000}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

services:
  # --- Postgres, with Supabase's managed roles and `auth` schema ------------
  db:
    image: supabase/postgres:15.19.0.007
    container_name: rcc-libro-db
    restart: unless-stopped
    environment:
      # postgres/roles.sql hands this password to authenticator and
      # supabase_auth_admin, which the image creates without one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      # The image applies /docker-entrypoint-initdb.d/migrations/*.sql in
      # filename order after its own; 9900+ sorts last, so our schema lands on
      # top of a fully-formed Supabase database. Fresh volume only.
      - ../supabase/schema.sql:/docker-entrypoint-initdb.d/migrations/9900-rcc-libro-schema.sql:ro
      - ./postgres/auth_helpers.sql:/docker-entrypoint-initdb.d/migrations/9910-auth-helpers.sql:ro
      - ./postgres/roles.sql:/docker-entrypoint-initdb.d/migrations/9990-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  # --- Auth (sign in, sign up, password reset, the admin users API) --------
  gotrue:
    image: supabase/gotrue:v2.197.0
    container_name: rcc-libro-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:${KONG_HTTP_PORT:-8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL:-http://localhost:3000}/**,http://localhost:${KONG_HTTP_PORT:-8000}/**
      GOTRUE_DISABLE_SIGNUP_EMAIL: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      # Password reset is a GoTrue e-mail. Point these at any local SMTP
      # listener (Mailpit on 1025 is the usual choice); with nothing listening
      # the rest of the stack works and only the reset link is undeliverable.
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-library@rcc.edu.ph}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mailpit}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: RCC LIBRO
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: http://localhost:${KONG_HTTP_PORT:-8000}/auth/v1/callback
      GOTRUE_LOG_LEVEL: info

  # --- REST over Postgres (every table read and every rpc() call) ----------
  postgrest:
    image: postgrest/postgrest:v16.5
    container_name: rcc-libro-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:${KONG_HTTP_PORT:-8000}
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: "3000"

  # --- Single origin the browser and the app both talk to -------------------
  kong:
    image: kong:3.8.0
    container_name: rcc-libro-gateway
    restart: unless-stopped
    depends_on:
      postgrest:
        condition: service_started
      gotrue:
        condition: service_started
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: cors
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 8 160k
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
    volumes:
      - ./kong.yml:/etc/kong/kong.yml:ro
    ports:
      # Published on loopback only, so a shared machine does not expose the API.
      - "127.0.0.1:${KONG_HTTP_PORT:-8000}:8000"
    healthcheck:
      # The kong image ships neither curl nor wget and its `sh` has no /dev/tcp,
      # so ask bash to open the proxy socket and read one GoTrue endpoint that
      # answers without credentials. It also proves gateway→auth works.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /auth/v1/settings HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- The Next.js app ------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: http://localhost:${KONG_HTTP_PORT:-8000}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    image: rcc-libro/app:local
    container_name: rcc-libro-app
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
    environment:
      <<: *api-keys
      # Server-side calls stay inside the network; the browser above must use
      # the published loopback URL, which is what NEXT_PUBLIC_* is for.
      SUPABASE_INTERNAL_URL: http://kong:8000
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS}
      CRON_SECRET: ${CRON_SECRET}
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-3000}:3000"

  # --- one-shot bootstrap for the demo, in `docker compose --profile demo` --
  demo-accounts:
    profiles: ["demo"]
    image: rcc-libro/app:local
    container_name: rcc-libro-demo-accounts
    depends_on:
      kong:
        condition: service_healthy
    environment:
      <<: *api-keys
      # Inside the network "localhost" is this container, so the script that
      # talks to the gateway has to use its service name.
      NEXT_PUBLIC_SUPABASE_URL: http://kong:8000
      DEMO_PASSWORD: ${DEMO_PASSWORD}
    entrypoint: ["node", "scripts/create-demo-accounts.mjs"]
    restart: "no"

  seed:
    profiles: ["demo"]
    image: postgres:15-alpine
    container_name: rcc-libro-seed
    depends_on:
      demo-accounts:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        psql "host=db port=5432 user=supabase_admin dbname=postgres" -v ON_ERROR_STOP=1
        -f /seed/seed-demo.sql &&
        psql "host=db port=5432 user=supabase_admin dbname=postgres" -v ON_ERROR_STOP=1
        -c "select count(*) as books from public.books"
    volumes:
      - ../supabase/seed-demo.sql:/seed/seed-demo.sql:ro
    restart: "no"

volumes:
  db-data:
